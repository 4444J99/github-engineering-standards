# Phase 1 (secrets & supply chain) — reusable, WARN-ONLY.
# Callers pin this workflow by commit SHA or an immutable tag, e.g.
#   uses: 4444J99/github-engineering-standards/.github/workflows/phase1-warn.yml@<sha>
# Nothing here fails a build unless the caller sets `enforce: true` (not part of the warn-only rollout).
name: phase1-warn
on:
  workflow_call:
    inputs:
      standards-ref:
        description: Commit SHA of github-engineering-standards to load the checks from (use the same SHA you pinned above).
        type: string
        required: true
      needs-json:
        description: Caller's toJSON(needs) for the honest-green aggregate. Leave empty to skip that job.
        type: string
        default: ''
      enforce:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phase1-warn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 4444J99/github-engineering-standards
          ref: ${{ inputs.standards-ref }}
          persist-credentials: false
          path: ges
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned tools (checksum-verified)
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML==6.0.3
          curl -fsSL -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          printf '%s  al.tgz\n%s  gl.tgz\n' \
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 \
            5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf al.tgz -C "$RUNNER_TEMP/bin" actionlint
          tar -xzf gl.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Workflow & supply-chain rules
        env:
          ENFORCE: ${{ inputs.enforce && '--enforce' || '' }}
        run: python ges/standards/phase1/check.py target $ENFORCE
      - name: actionlint
        working-directory: target
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -uo pipefail
          rc=0; out=""
          if [ -d .github/workflows ]; then out=$(actionlint -no-color -oneline 2>&1); rc=$?; fi
          if [ -n "$out" ]; then printf '%s\n' "$out" | sed 's/^/::warning title=phase1\/actionlint::/'; fi
          echo "actionlint rc=$rc"
          if [ "$ENFORCE" = "true" ]; then exit "$rc"; fi
      - name: gitleaks (current tree; findings redacted)
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -uo pipefail
          gitleaks dir target --redact --no-banner -r gitleaks.json -f json; rc=$?
          python - <<'PY'
          import json
          for x in json.load(open("gitleaks.json")) or []:
              print(f"::warning title=phase1/secret-scan::{x['File']}:{x['StartLine']} {x['RuleID']} (redacted)")
          PY
          echo "gitleaks rc=$rc"
          if [ "$ENFORCE" = "true" ]; then exit "$rc"; fi

  honest-green:
    if: ${{ always() && inputs.needs-json != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 4444J99/github-engineering-standards
          ref: ${{ inputs.standards-ref }}
          persist-credentials: false
      - name: Aggregate (skipped, cancelled, failed or 0-step jobs are not green)
        env:
          NEEDS_JSON: ${{ inputs.needs-json }}
          GH_TOKEN: ${{ github.token }}
          ENFORCE: ${{ inputs.enforce && '--enforce' || '' }}
        run: |
          set -uo pipefail
          RUN_JOBS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" 2>/dev/null || echo '')
          export RUN_JOBS_JSON
          python3 standards/phase1/honest_green.py $ENFORCE
