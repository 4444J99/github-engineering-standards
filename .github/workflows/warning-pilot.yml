name: Warning-only standards inspection
on:
  workflow_call:
    inputs:
      expected-checks:
        description: 'Reviewed JSON array of check names; not an execution attestation'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch consumer objects without a working tree
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.workspace }}/candidate
        run: |
          python3 - <<'PY'
          import base64, os, re, subprocess
          from pathlib import Path
          repo, revision = os.environ['SOURCE_REPOSITORY'], os.environ['REVISION']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise ValueError('Invalid source identity')
          path = os.environ['CANDIDATE']
          subprocess.run(['git', 'init', '--bare', path], check=True, capture_output=True, timeout=15)
          credential = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          result = subprocess.run(['git', '-C', path, 'fetch', '--depth=1', '--filter=blob:limit=1048577',
                                   'https://github.com/' + repo + '.git', revision],
                                  env=env, capture_output=True, timeout=45)
          if result.returncode:
              raise RuntimeError('Authenticated source fetch failed')
          subprocess.run(['git', '-C', path, 'update-ref', 'HEAD', revision], check=True, capture_output=True, timeout=15)
          PY
      - name: Read immutable inspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 4444J99/github-engineering-standards
          ref: a5cdf48e9f255cb407a1ae69be62397f1151847d
          path: toolkit
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install inspector dependency
        working-directory: toolkit
        run: |
          echo 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/ges-requirements.txt"
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r "$RUNNER_TEMP/ges-requirements.txt"
      - name: Inspect data without executing consumer code
        id: inspect
        working-directory: toolkit
        env:
          CANDIDATE: ${{ github.workspace }}/candidate
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHECKS: ${{ inputs.expected-checks }}
          EVIDENCE: ${{ runner.temp }}/ges-warning
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, time, threading, urllib.request
          from ges.yamlutil import parse
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from ges.warning_pilot import main, validate_plan
          started = time.monotonic()
          candidate = os.environ['CANDIDATE']
          if os.environ['GITHUB_EVENT_NAME'] not in ('push', 'pull_request', 'workflow_dispatch'):
              raise ValueError('Unsupported or privileged caller event')
          revision = os.environ['REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise ValueError('Expected exact lowercase commit SHA')
          def git(*args):
              return subprocess.check_output(['git', '-C', candidate, *args], timeout=15, env=dict(os.environ, GIT_NO_LAZY_FETCH='1'), stderr=subprocess.PIPE)
          if git('rev-parse', 'HEAD').decode().strip() != revision:
              raise ValueError('Checkout does not match requested revision')
          plan = {'repository_id': int(os.environ['REPOSITORY_ID']), 'revision': revision,
                  'checks': json.loads(os.environ['EXPECTED_CHECKS'])}
          plan['plan_digest'] = hashlib.sha256(json.dumps(plan, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          validate_plan(plan)
          def entries():
              proc = subprocess.Popen(['git', '-C', candidate, 'ls-tree', '-z', revision, '.github/workflows/'], stdout=subprocess.PIPE)
              timer = threading.Timer(15, proc.kill)
              timer.start()
              try:
                  pending, consumed = b'', 0
                  while True:
                      chunk = proc.stdout.read(4096)
                      if not chunk:
                          if proc.wait() != 0:
                              raise ValueError('Tree enumeration failed or timed out')
                          break
                      consumed += len(chunk)
                      if consumed > 1024 * 1024:
                          raise ValueError('Tree enumeration exceeds 1 MiB')
                      pending += chunk
                      while b'\0' in pending:
                          entry, pending = pending.split(b'\0', 1)
                          yield entry
                  if pending:
                      raise ValueError('Truncated tree entry')
              finally:
                  timer.cancel()
                  proc.stdout.close()
                  if proc.poll() is None:
                      proc.kill()
                  proc.wait()
          stream = entries()
          files, complete, total = {}, True, 0
          for entry in stream:
              metadata, raw_path = entry.split(b'\t', 1)
              mode, kind, oid = metadata.decode().split()
              path = raw_path.decode('utf-8')
              if path.count('/') != 2 or not path.endswith(('.yml', '.yaml')):
                  continue
              if len(files) >= 128:
                  complete = False
                  break
              if mode == '120000':
                  files[path] = {'kind': 'symlink'}
                  continue
              if kind != 'blob':
                  complete = False
                  continue
              try:
                  size = int(git('cat-file', '-s', oid).decode())
              except subprocess.CalledProcessError:
                  complete = False
                  continue  # An absent filtered blob is unknown; never lazy-fetch credentials.
              if size > 1024 * 1024 or total + size > 8 * 1024 * 1024:
                  complete = False
                  continue
              total += size
              try:
                  files[path] = git('cat-file', 'blob', oid).decode('utf-8')
              except UnicodeDecodeError:
                  complete = False
          stream.close()
          def local_reference(value, seen=None):
              seen = set() if seen is None else seen
              if isinstance(value, (dict, list)):
                  if id(value) in seen:
                      return False
                  seen.add(id(value))
              if isinstance(value, dict):
                  return (isinstance(value.get('uses'), str) and value['uses'].startswith('./')) or any(local_reference(v, seen) for v in value.values())
              return isinstance(value, list) and any(local_reference(v, seen) for v in value)
          for value in files.values():
              if isinstance(value, str):
                  try:
                      if local_reference(parse(value)):
                          complete = False
                  except Exception:
                      complete = False  # Parsing uncertainty cannot establish dependency completeness.
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + str(int(os.environ['GITHUB_RUN_ID'])),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              raw_run = response.read(1024 * 1024 + 1)
          if len(raw_run) > 1024 * 1024:
              raise ValueError('Run metadata exceeds 1 MiB')
          run = json.loads(raw_run)
          wrappers = [w for w in run.get('referenced_workflows', []) if w.get('path', '').startswith('4444J99/github-engineering-standards/.github/workflows/warning-pilot.yml@')]
          if len(wrappers) != 1 or not re.fullmatch(r'[0-9a-f]{40}', wrappers[0].get('sha', '')):
              raise ValueError('Cannot bind invoked wrapper to GitHub run metadata')
          if wrappers[0]['path'] != '4444J99/github-engineering-standards/.github/workflows/warning-pilot.yml@' + wrappers[0]['sha']:
              raise ValueError('Wrapper must be called at an immutable full SHA')
          snapshot = {'repository_id': plan['repository_id'], 'revision': revision,
                      'observations': {'files': {'status': 'OK', 'complete': complete, 'data': files}}}
          root = Path(os.environ['EVIDENCE'])
          root.mkdir(mode=0o700)
          for name, value in (('snapshot', snapshot), ('plan', plan)):
              (root / (name + '.json')).write_text(json.dumps(value, indent=2) + '\n')
          import sys
          sys.argv = ['warning-pilot', '--snapshot', str(root / 'snapshot.json'),
                      '--plan', str(root / 'plan.json'), '--output', str(root / 'report.json')]
          if main() != 0:
              raise RuntimeError('Inspection failed')
          report = json.loads((root / 'report.json').read_text())
          retained = {}
          for name in ('plan.json', 'report.json'):
              raw = (root / name).read_bytes()
              retained[name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}
          manifest = {'schema': 'ges.warning-workflow.v1', 'owner': os.environ['GITHUB_REPOSITORY_OWNER'],
                      'repository': os.environ['GITHUB_REPOSITORY'], 'repository_id': plan['repository_id'],
                      'revision': revision, 'source_repository': os.environ['SOURCE_REPOSITORY'],
                      'source_repository_id': int(os.environ['SOURCE_REPOSITORY_ID']),
                      'wrapper': wrappers[0], 'dependency_sha256': 'ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc',
                      'toolkit_repository': '4444J99/github-engineering-standards', 'toolkit_commit': 'a5cdf48e9f255cb407a1ae69be62397f1151847d',
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'workflow_files_observed': len(files), 'workflow_inventory_complete': complete,
                      'invocation_seconds': round(time.monotonic() - started, 6),
                      'timing_scope': 'inspection only; hosted job duration must be measured separately',
                      'plan_authority': 'caller-declared configuration, not independently authenticated execution policy',
                      'retention_deadline': (datetime.now(timezone.utc) + timedelta(days=30)).isoformat(),
                      'access': 'caller repository Actions artifact permissions',
                      'retrieval_verified': False, 'restoration_verified': False, 'files': retained}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Warning-only inspection completed; execution remains NOT_VERIFIABLE.\n')
              for finding in report['findings']:
                  summary.write(f"- {finding['control']}: {finding['status']}\n")
          PY
      - name: Retain report and integrity manifest in caller custody
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warning-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ges-warning/plan.json
            ${{ runner.temp }}/ges-warning/report.json
            ${{ runner.temp }}/ges-warning/manifest.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
