name: Source acquisition and coverage
on:
  workflow_dispatch:
    inputs:
      rendered_limit:
        description: 'Maximum rendered English article bodies; 0 inventories pages only'
        default: '40'
        required: true
  push:
    paths:
      - sources/sources.lock.json
      - scripts/a3_*.py
      - ges/pinned_sources.py
      - evidence/a3-six-source-capsule-repair.json
      - .github/workflows/source-acquisition.yml
  pull_request:
    paths:
      - sources/sources.lock.json
      - scripts/a3_*.py
      - ges/pinned_sources.py
      - evidence/a3-six-source-capsule-repair.json
      - .github/workflows/source-acquisition.yml
permissions:
  contents: read
concurrency:
  group: ges-source-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Acquire pinned archives, reconcile Git trees and sample rendered bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDERED_LIMIT: ${{ inputs.rendered_limit || '40' }}
        run: |
          python - <<'PY'
          import os, subprocess
          limit=int(os.environ['RENDERED_LIMIT'])
          if not 0 <= limit <= 20000: raise SystemExit('rendered_limit must be 0..20000')
          command=['python','-m','ges','sync','--output','.cache/sources']
          if limit: command += ['--rendered','--rendered-limit',str(limit)]
          subprocess.run(command,check=True)
          PY
      - run: python -m ges corpus --snapshots .cache/sources --output .cache/corpus
      - run: python -m ges ledger --snapshots .cache/sources --corpus .cache/corpus
      - name: Verify pinned text against the repaired capsule content identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ges.pinned_sources import inventory_digest, verify_snapshot
          baseline = json.loads(Path('evidence/a3-six-source-capsule-repair.json').read_text())
          lock = json.loads(Path('sources/sources.lock.json').read_text())
          sources = Path('.cache/sources')
          for spec in lock['sources']:
              repo = spec['repository']
              slug = repo.replace('/', '__')
              inventory = json.loads((sources / (slug+'.inventory.json')).read_text())
              if inventory_digest(inventory) != baseline['inventory_identity_digests'][repo]:
                  raise ValueError('Acquired inventory differs from repaired A3 baseline')
              verify_snapshot(sources / (slug+'.text.jsonl.gz'), inventory, repo, spec['commit'])
          print('Six pinned source snapshots replayed; no semantic or owner acceptance asserted')
          PY
      - name: Package public-safe metadata evidence
        if: always()
        run: |
          mkdir -p .cache/evidence
          cp .cache/sources/*report.json .cache/evidence/ 2>/dev/null || true
          cp .cache/sources/*.tree-reconciliation.json .cache/evidence/ 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md .cache/evidence/
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('.cache/metadata-evidence.tar.gz', 'w:gz') as archive:
              for name in ('evidence', 'corpus'):
                  path = Path('.cache') / name
                  if path.exists():
                      archive.add(path, arcname=name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standards-metadata-evidence
          path: .cache/metadata-evidence.tar.gz
          retention-days: 30
          if-no-files-found: error
