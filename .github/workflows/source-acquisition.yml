name: Source acquisition and coverage
on:
  workflow_dispatch:
    inputs:
      rendered_limit:
        description: 'Maximum rendered English article bodies; 0 inventories pages only'
        default: '40'
        required: true
  push:
    paths:
      - sources/sources.lock.json
      - docs/source-charters/**
      - evidence/a4-source-charters.json
      - evidence/a4-capsule-baseline.json
      - ges/source_charters.py
      - ges/pinned_sources.py
      - ges/structured_review.py
      - .github/workflows/source-acquisition.yml
      - ges/**
      - tests/test_source_charters.py
      - requirements.txt
  pull_request:
    paths:
      - sources/sources.lock.json
      - docs/source-charters/**
      - evidence/a4-source-charters.json
      - evidence/a4-capsule-baseline.json
      - ges/source_charters.py
      - ges/pinned_sources.py
      - ges/structured_review.py
      - .github/workflows/source-acquisition.yml
      - ges/**
      - tests/test_source_charters.py
      - requirements.txt
permissions:
  contents: read
concurrency:
  group: ges-source-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Acquire pinned archives, reconcile Git trees and sample rendered bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDERED_LIMIT: ${{ inputs.rendered_limit || '40' }}
        run: |
          python - <<'PY'
          import os, subprocess
          limit=int(os.environ['RENDERED_LIMIT'])
          if not 0 <= limit <= 20000: raise SystemExit('rendered_limit must be 0..20000')
          command=['python','-m','ges','sync','--output','.cache/sources']
          if limit: command += ['--rendered','--rendered-limit',str(limit)]
          subprocess.run(command,check=True)
          PY
      - run: python -m ges corpus --snapshots .cache/sources --output .cache/corpus
      - run: python -m ges ledger --snapshots .cache/sources --corpus .cache/corpus
      - name: Replay charter citations against trusted A3 content identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ges.source_charters import validate_manifest
          binding = json.loads(Path('evidence/a4-source-charters.json').read_text())
          result = validate_manifest(Path('.'), Path('.cache/sources'),
                                    capsule_receipt=Path('evidence/a4-capsule-baseline.json'),
                                    capsule_sha256=binding['a3_capsule_sha256'],
                                    receipt_sha256=binding['a3_receipt_sha256'])
          print(json.dumps(result))
          PY
      - name: Package public-safe metadata evidence
        if: always()
        run: |
          mkdir -p .cache/evidence
          cp .cache/sources/*report.json .cache/evidence/ 2>/dev/null || true
          cp .cache/sources/*.tree-reconciliation.json .cache/evidence/ 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md .cache/evidence/
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('.cache/metadata-evidence.tar.gz', 'w:gz') as archive:
              for name in ('evidence', 'corpus'):
                  path = Path('.cache') / name
                  if path.exists():
                      archive.add(path, arcname=name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standards-metadata-evidence
          path: .cache/metadata-evidence.tar.gz
          retention-days: 30
          if-no-files-found: error
