name: Source acquisition and coverage
on:
  workflow_dispatch:
    inputs:
      rendered_limit:
        description: 'Maximum rendered English article bodies; 0 inventories pages only'
        default: '40'
        required: true
  push:
    paths:
      - sources/sources.lock.json
permissions:
  contents: read
concurrency:
  group: ges-source-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Acquire pinned archives, reconcile Git trees and sample rendered bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDERED_LIMIT: ${{ inputs.rendered_limit || '40' }}
        run: |
          python - <<'PY'
          import os, subprocess
          limit=int(os.environ['RENDERED_LIMIT'])
          if not 0 <= limit <= 20000: raise SystemExit('rendered_limit must be 0..20000')
          command=['python','-m','ges','sync','--output','.cache/sources']
          if limit: command += ['--rendered','--rendered-limit',str(limit)]
          subprocess.run(command,check=True)
          PY
      - run: python -m ges corpus --snapshots .cache/sources --output .cache/corpus
      - run: python -m ges ledger --snapshots .cache/sources --corpus .cache/corpus
      - name: Package public-safe metadata evidence
        if: always()
        run: |
          mkdir -p .cache/evidence
          cp .cache/sources/*report.json .cache/evidence/ 2>/dev/null || true
          cp .cache/sources/*.tree-reconciliation.json .cache/evidence/ 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md .cache/evidence/
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('.cache/metadata-evidence.tar.gz', 'w:gz') as archive:
              for name in ('evidence', 'corpus'):
                  path = Path('.cache') / name
                  if path.exists():
                      archive.add(path, arcname=name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: standards-metadata-evidence
          path: .cache/metadata-evidence.tar.gz
          retention-days: 30
          if-no-files-found: error
