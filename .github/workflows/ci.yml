name: Toolkit validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ges-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce current workload and preserve historical accounting
        run: >-
          python -m ges.claim_workload
          --reviews evidence/source-reviews
          --artifacts evidence/claim-workload-inputs/artifacts.jsonl.gz
          --reconciliation evidence/provider-oidc-reconciliation.json
          --check evidence/claim-workload-current-inventory.json
          --historical evidence/claim-workload-inventory.json
          --provenance evidence/claim-workload-current-provenance.json
      - run: python -m ges validate
      - run: python -m ges compile
      - name: Generated views match the canonical catalog
        run: git diff --exit-code -- generated/functional-checklist.md generated/source-crosswalk.md generated/bindings.json
