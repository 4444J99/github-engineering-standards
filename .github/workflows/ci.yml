name: Toolkit validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ges-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ges validate
      - run: python -m ges compile
      - name: Generated views match the canonical catalog
        run: git diff --exit-code -- generated/functional-checklist.md generated/source-crosswalk.md generated/bindings.json
