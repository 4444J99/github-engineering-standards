name: Branch pilot
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  pilot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run disposable pilot canary
        run: python3 pilot_canary.py
  pilot-required:
    name: pilot-required
    runs-on: ubuntu-latest
    needs: pilot-test
    if: ${{ always() }}
    steps:
      - name: Fail unless the dependency succeeded
        env:
          TEST_RESULT: ${{ needs.pilot-test.result }}
        run: test "$TEST_RESULT" = success
